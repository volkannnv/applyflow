services:
  - type: web
    name: applyflow
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm test && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: applyflow-db
          property: connectionString

databases:
  - name: applyflow-db
    plan: free
    region: frankfurt
    databaseName: applyflow
    user: applyflow
    ipAllowList: []
